[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ncclfuse"
version = "0.1.0"
description = "Communication scheduling and compute-communication fusion for distributed PyTorch"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["torch>=2.2"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
gpu = ["triton>=3.0"]

[tool.setuptools.packages.find]
include = ["ncclfuse*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
